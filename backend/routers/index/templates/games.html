<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC&family=Great+Vibes&display=swap" />
  <link rel="stylesheet" href="/landing.css" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      padding: 24px 16px 64px;
    }
    .games-wrap {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .games-back {
      display: inline-block;
      text-decoration: none;
      color: inherit;
      font-size: 0.95rem;
      opacity: 0.7;
    }
    .games-back:hover { opacity: 1; }
    .games-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem;
      text-align: center;
    }
    .game-card {
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 12px;
      padding: 20px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .game-card-title {
      font-size: 1.25rem;
      margin-bottom: 12px;
      text-align: center;
    }
    .game-mount {
      width: 100%;
      min-height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      border-radius: 8px;
      color: #888;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="games-wrap">
    <a class="games-back" href="/">← zpět</a>
    <h1 class="games-title">Games</h1>

    <!-- Game 1: Sailing -->
    <section class="game-card" id="game-1-card">
      <h2 class="game-card-title">Jachting</h2>
      <div class="game-mount" id="game-1-mount" style="flex-direction:column; padding:0; background:transparent; min-height:unset;"></div>
    </section>
    <style>
      .sail-wrap { width: 100%; display: flex; flex-direction: column; gap: 10px; }
      .sail-stage { position: relative; width: 100%; }
      .sail-canvas { width: 100%; background: #bfe0ef; border-radius: 8px; display: block; touch-action: none; }
      .sail-overlay {
        position: absolute; inset: 0; border-radius: 8px;
        background: rgba(20, 45, 65, 0.78); color: #fff;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; gap: 14px; padding: 24px;
      }
      .sail-overlay.hidden { display: none; }
      .sail-overlay h3 { font-family: 'Great Vibes', cursive; font-size: 2.2rem; margin: 0; }
      .sail-overlay .keys { display: flex; flex-direction: column; gap: 10px; font-size: 0.95rem; }
      .sail-overlay .keyrow { display: flex; align-items: center; justify-content: center; gap: 10px; }
      .sail-overlay kbd {
        display: inline-block; min-width: 26px; padding: 3px 7px; border-radius: 5px;
        background: #fff; color: #234; font-weight: 700; font-family: inherit;
        box-shadow: 0 2px 0 rgba(0,0,0,0.25); font-size: 0.9rem;
      }
      .sail-overlay .hint { opacity: 0.85; font-size: 0.85rem; max-width: 360px; line-height: 1.4; }
      .sail-overlay button {
        padding: 9px 20px; border-radius: 8px; border: none; cursor: pointer;
        background: #e2c044; color: #234; font-weight: 700; font-size: 0.95rem;
      }
      .sail-overlay button:hover { background: #ecd06a; }
      .sail-hud { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 0.9rem; flex-wrap: wrap; }
      .sail-hud .stats { display: flex; gap: 16px; flex-wrap: wrap; color: #444; }
      .sail-hud .stats b { color: #1a1a1a; font-variant-numeric: tabular-nums; }
      .sail-hud .msg { color: #2a6e2a; font-weight: 700; min-height: 1.2em; }
      .sail-hud button { padding: 6px 12px; border-radius: 6px; border: 1px solid #888; background: #fff; cursor: pointer; }
      .sail-hud button:hover { background: #f3f3f3; }
      .sail-hud .power-toggle { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; color: #444; }
    </style>
    {% raw %}
    <script>
      (function initSailing() {
        var mount = document.getElementById('game-1-mount');
        if (!mount) return;

        var wrap = document.createElement('div');
        wrap.className = 'sail-wrap';
        wrap.innerHTML = ''
          + '<div class="sail-stage">'
          + '  <canvas class="sail-canvas" width="640" height="400"></canvas>'
          + '  <div class="sail-overlay">'
          + '    <h3>Jachting</h3>'
          + '    <div class="keys">'
          + '      <div class="keyrow"><kbd>←</kbd><kbd>→</kbd><span>kormidlo &mdash; zatáčej loď</span></div>'
          + '      <div class="keyrow"><kbd>↑</kbd><kbd>↓</kbd><span>plachta &mdash; přehoď z jedné strany na druhou</span></div>'
          + '    </div>'
          + '    <div class="hint">Vyplouváš z přístavu vlevo na otevřené moře &ndash; žádný cíl, jen doplav co nejdál na východ. Natoč plachtu tak, aby tě vítr hnal. Když projedeš větrem (zatočíš na druhou stranu), přehoď i plachtu klávesami ↑/↓ přes střed na druhou stranu &ndash; jinak se obrátí naprázdno a loď se zastaví. Proti větru (od východu) musíš křižovat v cik-cak.</div>'
          + '    <button type="button" class="start-btn">Vyplout (mezerník)</button>'
          + '  </div>'
          + '</div>'
          + '<div class="sail-hud">'
          + '  <div class="stats">'
          + '    <span>Vítr: <b class="wind-val">–</b></span>'
          + '    <span>Rychlost: <b class="speed-val">0.0</b> kn</span>'
          + '    <span>Plachta: <b class="trim-val">45</b>°</span>'
          + '    <span>Vzdálenost: <b class="dist-val">0</b> m</span>'
          + '  </div>'
          + '  <label class="power-toggle"><input type="checkbox" class="power-chk" /> Síly</label>'
          + '  <span class="msg"></span>'
          + '  <button type="button" class="new-game">Nová hra</button>'
          + '</div>';
        mount.appendChild(wrap);

        var canvas = wrap.querySelector('canvas');
        var ctx = canvas.getContext('2d');
        var overlay = wrap.querySelector('.sail-overlay');
        var startBtn = wrap.querySelector('.start-btn');
        var newGameBtn = wrap.querySelector('.new-game');
        var powerChk = wrap.querySelector('.power-chk');
        var windVal = wrap.querySelector('.wind-val');
        var speedVal = wrap.querySelector('.speed-val');
        var trimVal = wrap.querySelector('.trim-val');
        var distVal = wrap.querySelector('.dist-val');
        var msgEl = wrap.querySelector('.msg');

        function deg2rad(d) { return d * Math.PI / 180; }

        // World: x grows without bound to the right, starting at the port on the
        // left. y 0..100 is lateral, +y = up the screen. VIEW_W world units of x
        // fit on screen at once; the camera scrolls to keep the boat in view.
        var VIEW_W = 100, H = 100;
        var PORT_X = 9, WIND_SPEED = 1.0;
        var METERS_PER_UNIT = 3;   // world units -> the metres shown in the HUD
        var MARKER_SPACING = 25;   // distance buoys every N world units

        // Wind described by where it BLOWS TOWARD, in math degrees (0 = +x right, 90 = +y up).
        // East wind blows toward the west (180) -> dead headwind, must be beaten upwind by tacking.
        var WIND_DIRS = [
          { from: 'západu',       to: 0 },
          { from: 'severozápadu', to: -45 },
          { from: 'jihozápadu',   to: 45 },
          { from: 'severu',       to: -90 },
          { from: 'jihu',         to: 90 },
          { from: 'severovýchodu', to: -135 },
          { from: 'jihovýchodu',   to: 135 },
          { from: 'východu',       to: 180 },
        ];
        var NO_GO = 42; // degrees either side of straight-into-wind where the sail can't drive

        // Sail polar for the lift/drag model, read off a measured CL/CD-vs-angle-
        // of-attack chart: attached flow to ~25° (steep lift rise to the 1.52
        // peak), separating to ~50°, stalled beyond (lift collapses while drag
        // keeps growing). Rows are [aoa°, CL, CD]; polarValue interpolates
        // linearly between rows. Defined up here because reset() already runs the
        // speed model during script init.
        var SAIL_POLAR = [
          [ 0, 0.00, 0.10],
          [10, 0.15, 0.14],
          [15, 0.88, 0.17],
          [18, 1.16, 0.18],
          [20, 1.40, 0.21],
          [25, 1.52, 0.25],
          [30, 1.47, 0.32],
          [40, 1.38, 0.45],
          [50, 0.95, 0.55],
          [60, 0.75, 0.75],
          [70, 0.44, 0.97],
          [80, 0.29, 1.25],
          [90, 0.15, 1.40]
        ];
        // tuning: brings the aero force into the same speed range as defaultSpeedModel
        var LD_THRUST_SCALE = 10;

        var state, started, lastT;
        var keys = {};

        // Active speed model — swap algorithms by reassigning this (the models are
        // defined in the simulation section below; function declarations hoist, so
        // referencing them here is safe). Assigned before reset() first runs because
        // reset() uses it to fill the boat's derived aero values.
        var speedModel = liftDragSpeedModel;

        function reset() {
          var wind = WIND_DIRS[Math.floor(Math.random() * WIND_DIRS.length)];
          var boat = {
            x: PORT_X, y: 50, heading: 0, speed: 0, sail: 45,
            // derived quantities, filled in by the speed model
            sailFull: false, driving: false, thrust: 0
          };
          state = { boat: boat, wind: wind };
          camX = cameraFor(boat);
          boat.sail = leewardSign(boat.heading) * 45; // start with the sail set on the leeward side
          speedModel(boat, 0); // refresh the derived values so the paused boat renders correctly
          started = false;
          overlay.classList.remove('hidden');
          windVal.textContent = 'od ' + wind.from;
          msgEl.textContent = '';
          keys = {};
        }

        function startGame() {
          if (started) return;
          started = true;
          overlay.classList.add('hidden');
          lastT = performance.now();
        }

        reset();
        newGameBtn.addEventListener('click', reset);
        startBtn.addEventListener('click', startGame);

        window.addEventListener('keydown', function(e) {
          var k = e.key;
          if (k === ' ' || k === 'Enter') { e.preventDefault(); startGame(); return; }
          if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(k) !== -1) {
            keys[k] = true; e.preventDefault();
          }
        });
        window.addEventListener('keyup', function(e) { keys[e.key] = false; });

        // ---- world -> screen mapping (flat top-down, scrolling camera) ----
        // camX is the world x at the left edge of the view. It follows the boat so
        // the boat sits at BOAT_SCREEN_FRAC across the view, but never scrolls back
        // past the port, so the start of the course stays framed as before.
        var padX = 16, padTop = 16, padBot = 16;
        var BOAT_SCREEN_FRAC = 0.4;
        var camX = 0;
        function cameraFor(boat) { return Math.max(0, boat.x - VIEW_W * BOAT_SCREEN_FRAC); }
        function sx(wx) { return padX + ((wx - camX) / VIEW_W) * (canvas.width - 2 * padX); }
        function sy(wy) { return padTop + ((H - wy) / H) * (canvas.height - padTop - padBot); }
        function worldXAt(screenX) {
          return camX + ((screenX - padX) / (canvas.width - 2 * padX)) * VIEW_W;
        }

        // ---- drawing ----
        var waveT = 0;

        function drawWater() {
          ctx.fillStyle = '#3a7da8';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          // moving wind streaks (in wind-blowing direction) for readability
          var a = deg2rad(state.wind.to);
          var ux = Math.cos(a), uy = -Math.sin(a);
          ctx.strokeStyle = 'rgba(255,255,255,0.16)';
          ctx.lineWidth = 2;
          for (var i = 0; i < 26; i++) {
            var bx = ((i * 73 + waveT * 40) % (canvas.width + 60)) - 30;
            var by = (i * 53) % canvas.height;
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(bx + ux * 16, by + uy * 16);
            ctx.stroke();
          }
        }

        function drawPort() {
          // grass + dock at the western shore; scrolls off once we sail away
          var x0 = 0, x1 = sx(PORT_X);
          if (x1 < -40) return;
          ctx.fillStyle = '#6a8f4f';
          ctx.fillRect(x0, 0, Math.max(0, x1 - 6), canvas.height);
          // dock planks jutting out
          ctx.fillStyle = '#8a5a33';
          var dy = sy(50);
          ctx.fillRect(x1 - 6, dy - 26, 26, 52);
          ctx.strokeStyle = 'rgba(0,0,0,0.2)';
          ctx.lineWidth = 1;
          for (var p = 0; p < 4; p++) {
            ctx.beginPath();
            ctx.moveTo(x1 - 6, dy - 26 + p * 17);
            ctx.lineTo(x1 + 20, dy - 26 + p * 17);
            ctx.stroke();
          }
          // little lighthouse
          ctx.fillStyle = '#f4f4f4';
          ctx.fillRect(14, sy(72) - 4, 14, 34);
          ctx.fillStyle = '#d23b3b';
          ctx.fillRect(14, sy(72) - 4, 14, 9);
          ctx.beginPath();
          ctx.moveTo(12, sy(72) - 4); ctx.lineTo(30, sy(72) - 4); ctx.lineTo(21, sy(72) - 14);
          ctx.closePath(); ctx.fillStyle = '#d23b3b'; ctx.fill();
        }

        // Distance buoys every MARKER_SPACING world units — the only fixed things
        // out on the open sea, so they are what makes the scrolling readable. Only
        // the ones currently in view are drawn, so the course can run on forever.
        function drawMarkers() {
          var first = Math.max(1, Math.ceil((worldXAt(-40) - PORT_X) / MARKER_SPACING));
          var last = Math.floor((worldXAt(canvas.width + 40) - PORT_X) / MARKER_SPACING);
          for (var i = first; i <= last; i++) {
            var wx = PORT_X + i * MARKER_SPACING;
            var bx = sx(wx);
            // deterministic lateral placement so a buoy keeps its spot
            var by = sy(18 + (i * 37) % 64);
            // mooring line
            ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx, by + 12); ctx.stroke();
            // float
            ctx.beginPath(); ctx.arc(bx, by, 7, 0, Math.PI * 2);
            ctx.fillStyle = '#e2c044'; ctx.fill();
            ctx.strokeStyle = '#8a6a10'; ctx.lineWidth = 1.5; ctx.stroke();
            // little mast + pennant
            ctx.strokeStyle = '#8a6a10'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(bx, by - 6); ctx.lineTo(bx, by - 20); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(bx, by - 20); ctx.lineTo(bx + 12, by - 16); ctx.lineTo(bx, by - 12);
            ctx.closePath(); ctx.fillStyle = '#d23b3b'; ctx.fill();
            // distance label
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(Math.round(i * MARKER_SPACING * METERS_PER_UNIT) + ' m', bx, by + 26);
          }
        }

        /** Angle in degrees (0 = +x right, 90 = +y up) -> screen-space unit vector
         *  (y flipped, since screen +y goes down). e.g. 90 -> {x: 0, y: -1}.
         *  @param {number} aDeg - angle in degrees
         *  @returns {{x: number, y: number}} unit vector in screen space */
        function angUnitS(aDeg) {
          var a = deg2rad(aDeg);
          return { x: Math.cos(a), y: -Math.sin(a) };
        }

        /** Normalize an angle in degrees to [-180, 180), so differences come out as
         *  the shortest signed turn (e.g. 350 -> -10). e.g. 190 -> -170, 360 -> 0.
         *  @param {number} d - angle in degrees
         *  @returns {number} equivalent angle in [-180, 180) */
        function angNorm(d) { return ((d + 180) % 360 + 360) % 360 - 180; }

        // The side the wind naturally pushes the sail toward (leeward) for a given heading.
        function leewardSign(h) {
          var f = angUnitS(h), w = angUnitS(state.wind.to);
          return (f.x * w.y - f.y * w.x) >= 0 ? 1 : -1;
        }

        /** Boom direction in degrees. boat.sail is the signed position the player sets,
         *  -90..+90: 0 = sheeted in along the centreline, +/-90 = boom all the way out
         *  on either side.
         *  @param {{heading: number, sail: number}} boat
         *  @returns {number} boom direction in degrees */
        function boomAngle(boat) { return boat.heading + 180 + boat.sail; }

        /** Mast position (the sail's pivot, a bit forward of centre) in screen space.
         *  @param {{x: number, y: number, heading: number}} boat
         *  @returns {{x: number, y: number}} screen coordinates */
        function mastPos(boat) {
          var fwd = angUnitS(boat.heading);
          return { x: sx(boat.x) + fwd.x * 3.6, y: sy(boat.y) + fwd.y * 3.6 };
        }

        function drawBoat() {
          var boat = state.boat;
          var P = { x: sx(boat.x), y: sy(boat.y) };
          var h = boat.heading;
          var fwd = angUnitS(h);              // screen-space forward
          var perp = { x: -fwd.y, y: fwd.x }; // screen-space port/starboard
          var L = 30, Wd = 9;

          // hull
          var bow   = { x: P.x + fwd.x * L * 0.6,  y: P.y + fwd.y * L * 0.6 };
          var sl    = { x: P.x - fwd.x * L * 0.45 + perp.x * Wd, y: P.y - fwd.y * L * 0.45 + perp.y * Wd };
          var sr    = { x: P.x - fwd.x * L * 0.45 - perp.x * Wd, y: P.y - fwd.y * L * 0.45 - perp.y * Wd };
          var midl  = { x: P.x + fwd.x * L * 0.2 + perp.x * Wd * 0.95, y: P.y + fwd.y * L * 0.2 + perp.y * Wd * 0.95 };
          var midr  = { x: P.x + fwd.x * L * 0.2 - perp.x * Wd * 0.95, y: P.y + fwd.y * L * 0.2 - perp.y * Wd * 0.95 };
          ctx.beginPath();
          ctx.moveTo(bow.x, bow.y);
          ctx.lineTo(midl.x, midl.y); ctx.lineTo(sl.x, sl.y);
          ctx.lineTo(sr.x, sr.y); ctx.lineTo(midr.x, midr.y);
          ctx.closePath();
          ctx.fillStyle = '#5b3a1e'; ctx.fill();
          ctx.strokeStyle = '#3a2512'; ctx.lineWidth = 1.5; ctx.stroke();

          // mast (a bit forward of centre)
          var mast = mastPos(boat);

          // sail rendered at the angle the player has set it to
          var windTo = angUnitS(state.wind.to);
          var sailLen = L * 0.95;
          // boom always renders on the side the player set it on
          var boom = angUnitS(boomAngle(boat));
          var clew = { x: mast.x + boom.x * sailLen, y: mast.y + boom.y * sailLen };

          if (!boat.sailFull || !boat.driving) {
            // luffing (in irons) or backwinded (wrong side): limp, flapping sail, no drive
            var flap = Math.sin(waveT * 16) * 7;
            var bp = { x: -boom.y, y: boom.x };
            var midF = { x: (mast.x + clew.x) / 2 + bp.x * flap, y: (mast.y + clew.y) / 2 + bp.y * flap };
            ctx.beginPath();
            ctx.moveTo(mast.x, mast.y);
            ctx.quadraticCurveTo(midF.x, midF.y, clew.x, clew.y);
            ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.stroke();
          } else {
            // working sail: billows downwind
            var bn = { x: -boom.y, y: boom.x };
            if (bn.x * windTo.x + bn.y * windTo.y < 0) { bn.x = -bn.x; bn.y = -bn.y; }
            var bulge = 9;
            var midB = { x: (mast.x + clew.x) / 2 + bn.x * bulge, y: (mast.y + clew.y) / 2 + bn.y * bulge };
            ctx.beginPath();
            ctx.moveTo(mast.x, mast.y);
            ctx.quadraticCurveTo(midB.x, midB.y, clew.x, clew.y);
            ctx.quadraticCurveTo(midB.x, midB.y, mast.x, mast.y);
            ctx.closePath();
            ctx.fillStyle = 'rgba(255,255,255,0.95)';
            ctx.fill();
            ctx.strokeStyle = '#cfd6db'; ctx.lineWidth = 1.5; ctx.stroke();
          }
          // mast dot
          ctx.beginPath(); ctx.arc(mast.x, mast.y, 2.5, 0, Math.PI * 2);
          ctx.fillStyle = '#2a2a2a'; ctx.fill();
        }

        /** Arrow from `from` in direction `aDeg` (math degrees, see angUnitS),
         *  `len` px long, with an arrowhead and an optional label past the tip. */
        function drawArrow(from, aDeg, len, color, label) {
          if (len < 2) return; // nothing meaningful to show
          var u = angUnitS(aDeg);
          var tipX = from.x + u.x * len, tipY = from.y + u.y * len;
          ctx.save();
          ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(tipX, tipY); ctx.stroke();
          var pa = Math.atan2(u.y, u.x);
          ctx.beginPath();
          ctx.moveTo(tipX, tipY);
          ctx.lineTo(tipX - Math.cos(pa - 0.4) * 9, tipY - Math.sin(pa - 0.4) * 9);
          ctx.lineTo(tipX - Math.cos(pa + 0.4) * 9, tipY - Math.sin(pa + 0.4) * 9);
          ctx.closePath(); ctx.fill();
          if (label) {
            ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(label, tipX + u.x * 14, tipY + u.y * 14 + 4);
          }
          ctx.restore();
        }

        // Force overlay (the "Síly" checkbox): wind and current thrust as arrows
        // rooted at the mast. Thrust acts along the heading; a negative thrust
        // (backwinded sail) points backwards.
        function drawForces() {
          var boat = state.boat;
          var mast = mastPos(boat);
          drawArrow(mast, state.wind.to, 45, '#c33', 'vítr');
          var t = boat.thrust, ang = boat.heading;
          if (t < 0) { ang += 180; t = -t; }
          drawArrow(mast, ang, Math.min(80, t * 3), '#1d7a1d', 'tah');
        }

        function drawWindBadge() {
          var cx = canvas.width - 46, cy = 46, r = 26;
          ctx.save();
          ctx.fillStyle = 'rgba(255,255,255,0.85)';
          ctx.beginPath(); ctx.arc(cx, cy, r + 5, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(cx, cy, r + 5, 0, Math.PI * 2); ctx.stroke();
          var u = angUnitS(state.wind.to);
          ctx.strokeStyle = '#c33'; ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(cx - u.x * r, cy - u.y * r);
          ctx.lineTo(cx + u.x * r, cy + u.y * r);
          ctx.stroke();
          var hx = cx + u.x * r, hy = cy + u.y * r;
          var pa = Math.atan2(u.y, u.x);
          ctx.beginPath();
          ctx.moveTo(hx, hy);
          ctx.lineTo(hx - Math.cos(pa - 0.4) * 10, hy - Math.sin(pa - 0.4) * 10);
          ctx.lineTo(hx - Math.cos(pa + 0.4) * 10, hy - Math.sin(pa + 0.4) * 10);
          ctx.closePath(); ctx.fillStyle = '#c33'; ctx.fill();
          ctx.fillStyle = '#222'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('vítr', cx, cy + r + 16);
          ctx.restore();
        }

        function draw() {
          drawWater();
          drawPort();
          drawMarkers();
          drawBoat();
          if (powerChk.checked) drawForces();
          drawWindBadge();
        }

        // ---- simulation ----

        // Speed model: owns the whole aero evaluation for a frame. Given the boat's
        // control state (heading, sail) and the wind, it must (a) store the derived
        // values back on the boat for the renderer and the HUD warnings: the
        // booleans sailFull (sail filled, i.e. not luffing in the no-go zone) and
        // driving (sail on the correct side and pulling), plus thrust (signed
        // force along the heading, shown by the force-arrows overlay) — and
        // (b) return the boat's new speed after `dt` seconds.
        // reset() calls it once with dt = 0 just to fill the derived values (speed
        // comes back unchanged). Swap in a different algorithm by reassigning
        // `speedModel` (declared above reset).
        function defaultSpeedModel(boat, dt) {
          var fwd = angUnitS(boat.heading);
          var windTo = angUnitS(state.wind.to);

          // sail power: 1 normally, ramping to 0 as the bow points into the wind (the
          // "no-go" zone). The wind comes FROM (wind.to + 180); pointing there = in irons.
          var bowToWind = Math.abs(angNorm(boat.heading - (state.wind.to + 180)));
          var power = bowToWind >= NO_GO ? 1 : Math.max(0, (bowToWind - (NO_GO - 10)) / 10);

          // drive: >0 correct (leeward) side, <=0 backwinded (wrong side).
          var n = angUnitS(boomAngle(boat) + 90); // sail normal
          var drive = (n.x * fwd.x + n.y * fwd.y) * (windTo.x * n.x + windTo.y * n.y);

          boat.sailFull = power >= 0.5;
          boat.driving = drive > 0.04;

          // sail force from the side the player has set the sail on
          var thrust = drive * WIND_SPEED * 26;
          if (thrust < 0) thrust *= 0.25; // sail backwinded (wrong side) -> barely any drive
          thrust *= power;                // sail luffs in the no-go zone -> no drive
          boat.thrust = thrust;

          var speed = boat.speed + thrust * dt;
          speed -= speed * 0.9 * dt;      // drag
          return Math.max(-1, Math.min(14, speed));
        }

        // ---- lift/drag speed model ----
        // Coefficient curves interpolated from the SAIL_POLAR table (defined with
        // the other constants at the top).
        function polarValue(aoa, col) {
          var t = SAIL_POLAR;
          if (aoa <= t[0][0]) return t[0][col];
          for (var i = 1; i < t.length; i++) {
            if (aoa <= t[i][0]) {
              var f = (aoa - t[i - 1][0]) / (t[i][0] - t[i - 1][0]);
              return t[i - 1][col] + f * (t[i][col] - t[i - 1][col]);
            }
          }
          return t[t.length - 1][col];
        }

        function coefficientOfLift(aoa) { return polarValue(aoa, 1); }
        function coefficientOfDrag(aoa) { return polarValue(aoa, 2); }

        // tuning: brings the aero force into the same speed range as defaultSpeedModel
        var LD_THRUST_SCALE = 40;

        // More realistic model: the boom's angle against the wind is the angle of
        // attack; the coefficient curves turn it into lift (perpendicular to the
        // wind) and drag (along the wind); their sum projected onto the heading is
        // the thrust. Note the projection uses the wind-to-heading geometry, not
        // the angle of attack itself — downwind the drive is pure drag (aoa 90°,
        // zero lift), upwind it is mostly lift. No explicit no-go zone is needed:
        // pointing too high leaves the sail with no usable angle of attack.
        function liftDragSpeedModel(boat, dt) {
          var fwd = angUnitS(boat.heading);
          var windTo = angUnitS(state.wind.to);

          // signed angle between the wind flow and the sail chord (the boom line);
          // the sign says which side of the sail the wind strikes
          var alpha = angNorm(state.wind.to - boomAngle(boat));
          // a chord has no front/back: fold the angle of attack to 0..90
          var aoa = Math.abs(alpha) > 90 ? 180 - Math.abs(alpha) : Math.abs(alpha);

          var lift = coefficientOfLift(aoa) * WIND_SPEED * WIND_SPEED * 0.5;
          var drag = coefficientOfDrag(aoa) * WIND_SPEED * WIND_SPEED * 0.5;

          // lift acts perpendicular to the wind, away from the sail's windward
          // side: pick the perpendicular with a positive component along the
          // sail's downwind-facing normal
          var n = angUnitS(boomAngle(boat) + 90);
          if (n.x * windTo.x + n.y * windTo.y < 0) { n.x = -n.x; n.y = -n.y; }
          var l = { x: -windTo.y, y: windTo.x };
          if (l.x * n.x + l.y * n.y < 0) { l.x = -l.x; l.y = -l.y; }

          // thrust = lift·sin(β) − drag·cos(β) with β the heading-to-wind angle,
          // done vectorially so every sign case (backwinded, in irons) works out
          var thrust = (lift * (l.x * fwd.x + l.y * fwd.y)
                      + drag * (windTo.x * fwd.x + windTo.y * fwd.y)) * LD_THRUST_SCALE;

          boat.sailFull = aoa >= 10; // flow nearly along the chord -> the sail just flaps
          boat.driving = thrust > 0.5;
          boat.thrust = thrust;

          var speed = boat.speed + thrust * dt;
          speed -= speed * 0.9 * dt;      // hull drag
          return Math.max(-1, Math.min(14, speed));
        }

        // Advances the boat by `dt` seconds: (1) applies the player's input,
        // (2) delegates the speed update (and the aero evaluation behind it) to
        // `speedModel`, and (3) integrates motion. Only called while sailing;
        // while paused the derived values stay valid (heading, sail and wind
        // can't change) — reset() fills them for a fresh boat.
        function updateBoat(boat, dt) {
          // --- input ---
          // steering
          if (keys['ArrowLeft'])  boat.heading += 75 * dt;
          if (keys['ArrowRight']) boat.heading -= 75 * dt;
          // sail: swings across the whole range, through the centreline to the other side
          if (keys['ArrowUp'])   boat.sail = Math.min(90,  boat.sail + 90 * dt);
          if (keys['ArrowDown']) boat.sail = Math.max(-90, boat.sail - 90 * dt);

          boat.speed = speedModel(boat, dt);

          // move (world +y = up; screen handled in sy)
          var fwd = angUnitS(boat.heading);
          boat.x += fwd.x * boat.speed * dt;
          boat.y += -fwd.y * boat.speed * dt;           // fwd.y is screen-space, flip back to world

          // bounds: the shore stops us to the west, the sea is open to the east
          if (boat.x < PORT_X) { boat.x = PORT_X; boat.speed *= 0.3; }
          if (boat.y < 3)   { boat.y = 3;   boat.speed *= 0.4; }
          if (boat.y > 97)  { boat.y = 97;  boat.speed *= 0.4; }

          camX = cameraFor(boat);
        }

        function frame(now) {
          var dt = started ? Math.min(0.05, (now - lastT) / 1000) : 0;
          lastT = now;
          waveT += dt;

          var boat = state.boat;
          if (started) updateBoat(boat, dt);

          // HUD
          trimVal.textContent = Math.round(Math.abs(boat.sail));
          speedVal.textContent = Math.max(0, boat.speed).toFixed(1);
          distVal.textContent = Math.max(0, Math.round((boat.x - PORT_X) * METERS_PER_UNIT));
          if (started) {
            if (!boat.sailFull) {
              msgEl.textContent = '⚠️ Plachta plápolá – jsi proti větru, křižuj (cik-cak)!';
              msgEl.style.color = '#b5651d';
            } else if (!boat.driving) {
              msgEl.textContent = '⚠️ Přehoď plachtu na druhou stranu (mezerník)!';
              msgEl.style.color = '#b5651d';
            } else {
              msgEl.textContent = '';
            }
          }

          draw();
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        // responsive: keep internal resolution, scale via CSS
        function fit() {
          var w = wrap.querySelector('.sail-stage').clientWidth;
          canvas.style.height = Math.round(w * (canvas.height / canvas.width)) + 'px';
        }
        fit();
        window.addEventListener('resize', fit);
      })();
    </script>
    {% endraw %}
  </div>
</body>
</html>
